spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nexus_quiz_test?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-only-jwt-secret-not-for-production-use-0123456789abcdef0123456789abcdef
  cookie:
    secure: false
    same-site: Lax
  admin:
    default-username: test-seed-admin
    default-password: TestOnlyAdminPassword1
  rate-limit:
    login:
      ip-requests-per-minute: 10000
      username-requests-per-minute: 10000

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
