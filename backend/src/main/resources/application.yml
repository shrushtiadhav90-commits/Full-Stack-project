spring:
  application:
    name: nexus-quiz-portal
  config:
    import: optional:file:.env[.properties]

  # ── Data Source ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema – never let Hibernate alter it
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC      # Hibernate writes/reads all DATETIME columns in UTC
        format_sql: false
    show-sql: false

  # ── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Mail (Jakarta Mail) ───────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Multipart / File upload ───────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-stacktrace: never     # never leak stack traces in HTTP responses
    include-message: always

# ── Application-specific properties ─────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:30}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  cookie:
    secure: true                  # overridden to false in application-dev.yml
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
  admin:
    default-username: ${ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${ADMIN_DEFAULT_PASSWORD:Admin@1234}
  email:
    enabled: ${EMAIL_ENABLED:false}
  storage:
    type: local

# ── Springdoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
