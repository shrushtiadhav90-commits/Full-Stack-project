<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Quiz Champion badge">
  <!-- Red/crimson circle background -->
  <circle cx="32" cy="32" r="30" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>
  <!-- Trophy cup body -->
  <path d="M22,18 L42,18 L40,32 C40,38 36,42 32,42 C28,42 24,38 24,32 Z"
        fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <!-- Trophy handles -->
  <path d="M22,22 C16,22 14,30 20,30" fill="none" stroke="#FEF3C7" stroke-width="2"
        stroke-linecap="round"/>
  <path d="M42,22 C48,22 50,30 44,30" fill="none" stroke="#FEF3C7" stroke-width="2"
        stroke-linecap="round"/>
  <!-- Trophy base stem -->
  <rect x="29" y="42" width="6" height="4" fill="#FEF3C7"/>
  <!-- Trophy base -->
  <rect x="24" y="46" width="16" height="3" rx="1.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <!-- No.1 inside trophy -->
  <text x="32" y="36" font-family="Nunito, sans-serif" font-size="12" font-weight="800"
        text-anchor="middle" fill="#D97706">1</text>
  <!-- Label -->
  <text x="32" y="57" font-family="Nunito, sans-serif" font-size="4.5" font-weight="700"
        text-anchor="middle" fill="#FEE2E2">QUIZ CHAMPION</text>
</svg>
