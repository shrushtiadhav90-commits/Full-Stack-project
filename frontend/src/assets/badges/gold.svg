<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Gold badge">
  <!-- Gold circle background -->
  <circle cx="32" cy="32" r="30" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <!-- Inner highlight ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.7"/>
  <!-- Star shape -->
  <polygon points="32,10 36,24 50,24 39,33 43,47 32,38 21,47 25,33 14,24 28,24"
           fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <!-- Label -->
  <text x="32" y="56" font-family="Nunito, sans-serif" font-size="7" font-weight="700"
        text-anchor="middle" fill="#92400E">GOLD</text>
</svg>
