<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Perfect Score badge">
  <!-- Deep blue background -->
  <circle cx="32" cy="32" r="30" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <!-- 100% text -->
  <text x="32" y="28" font-family="Nunito, sans-serif" font-size="14" font-weight="800"
        text-anchor="middle" fill="#FFFFFF">100</text>
  <text x="32" y="41" font-family="Nunito, sans-serif" font-size="9" font-weight="700"
        text-anchor="middle" fill="#BFDBFE">PERCENT</text>
  <!-- Label -->
  <text x="32" y="57" font-family="Nunito, sans-serif" font-size="5" font-weight="700"
        text-anchor="middle" fill="#DBEAFE">PERFECT SCORE</text>
</svg>
