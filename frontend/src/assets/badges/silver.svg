<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Silver badge">
  <!-- Silver circle background -->
  <circle cx="32" cy="32" r="30" fill="#94A3B8" stroke="#64748B" stroke-width="2"/>
  <!-- Inner highlight ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#CBD5E1" stroke-width="2" opacity="0.7"/>
  <!-- Star shape -->
  <polygon points="32,10 36,24 50,24 39,33 43,47 32,38 21,47 25,33 14,24 28,24"
           fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <!-- Label -->
  <text x="32" y="56" font-family="Nunito, sans-serif" font-size="7" font-weight="700"
        text-anchor="middle" fill="#1E293B">SILVER</text>
</svg>
